name: CI

on:
  push:
  pull_request:
  schedule:
    # 外链会随时间失效，每周一 03:17 UTC（北京 11:17）定时检查一次
    - cron: '17 3 * * 1'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 检查 README 与贡献指南中的链接
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,203,204,206,301,302,307,308,403,429
            --max-retries 3
            --retry-wait-time 2
            --timeout 30
            --max-concurrency 6
            README.md
            CONTRIBUTING.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 校验条目格式
        run: python scripts/check_format.py

