name: CI

on:
  push:
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 README 中的链接
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,203,204,206,301,302,307,308,403,429
            --max-retries 3
            --retry-wait-time 2
            --timeout 30
            --max-concurrency 6
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
